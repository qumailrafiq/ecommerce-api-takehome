openapi: 3.0.3
info:
  title: E-commerce API
  version: 1.0.0
  description: RESTful backend service for an e-commerce system built with Node.js, Express, and MongoDB.

servers:
  - url: http://localhost:4000/api
    description: Local development server

tags:
  - name: Auth
  - name: Category
  - name: Product
  - name: Cart
  - name: Order

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: "John Doe" }
                email: { type: string, example: "john@example.com" }
                password: { type: string, example: "password123" }
      responses:
        "201":
          description: User registered successfully
        "400":
          description: Invalid data or user already exists

  /auth/login:
    post:
      tags: [Auth]
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, example: "john@example.com" }
                password: { type: string, example: "password123" }
      responses:
        "200":
          description: Logged in successfully
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout user and clear cart
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User logged out successfully

  /categories:
    get:
      tags: [Category]
      summary: List all categories
      responses:
        "200":
          description: List of categories
    post:
      tags: [Category]
      summary: Create new category (Admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: "Electronics" }
      responses:
        "201":
          description: Category created successfully
        "403":
          description: Forbidden (non-admin)

  /categories/{id}:
    delete:
      tags: [Category]
      summary: Delete category (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Category deleted successfully

  /products:
    get:
      tags: [Product]
      summary: Get all products
      responses:
        "200":
          description: List of products
    post:
      tags: [Product]
      summary: Create a new product (Admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: "Apple MacBook Air M3" }
                description: { type: string, example: "13-inch Apple MacBook Air with M3 chip" }
                price: { type: number, example: 119999 }
                stockQuantity: { type: number, example: 30 }
                categoryId: { type: string, example: "67330f5e9b347f02a4a3e1d8" }
      responses:
        "201":
          description: Product created successfully
        "403":
          description: Forbidden (non-admin)

  /products/{id}:
    get:
      tags: [Product]
      summary: Get product by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Product details
        "404":
          description: Product not found

    put:
      tags: [Product]
      summary: Update product (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                price: { type: number }
                stockQuantity: { type: number }
      responses:
        "200":
          description: Product updated successfully

    delete:
      tags: [Product]
      summary: Delete product (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Product deleted successfully

  /cart:
    get:
      tags: [Cart]
      summary: Get user's cart
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User cart data

  /cart/add:
    post:
      tags: [Cart]
      summary: Add item to cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productId: { type: string, example: "673310e49b347f02a4a3e1d5" }
                quantity: { type: number, example: 2 }
      responses:
        "200":
          description: Item added to cart successfully

  /cart/clear:
    delete:
      tags: [Cart]
      summary: Clear user's cart
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Cart cleared successfully

  /orders:
    post:
      tags: [Order]
      summary: Place an order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paymentMethod: { type: string, example: "Credit Card" }
                shippingAddress:
                  type: object
                  properties:
                    name: { type: string, example: "John Doe" }
                    addressLine1: { type: string, example: "221B Baker Street" }
                    city: { type: string, example: "London" }
                    postalCode: { type: string, example: "NW1 6XE" }
                    country: { type: string, example: "UK" }
      responses:
        "201":
          description: Order placed successfully
        "400":
          description: Invalid request or empty cart

    get:
      tags: [Order]
      summary: Get all orders for the logged-in user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of user's orders

  /orders/{id}:
    get:
      tags: [Order]
      summary: Get order details by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Order details
        "404":
          description: Order not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
